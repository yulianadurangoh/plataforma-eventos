<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia sesión en Agenda Viva para consultar los próximos eventos.">
  <title>Iniciar sesión | Agenda Viva</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark navbar-agenda">
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">Agenda Viva</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <section class="caja-login card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 text-center mb-4">Iniciar sesión</h1>

        <form id="formulario-login">
          <div class="mb-3">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" id="usuario" name="usuario" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="clave" class="form-label">Contraseña</label>
            <input type="password" id="clave" name="clave" class="form-control" required>
          </div>

          <p id="mensaje-error" class="alert alert-danger d-none" role="alert"></p>

          <button type="submit" class="btn btn-agenda w-100">Ingresar</button>
        </form>

        <p class="text-center mt-3 mb-0"><a href="index.html">Volver al inicio</a></p>
      </div>
    </section>
  </main>

  <footer class="pie text-center">
    <p class="mb-0">Agenda Viva · Plataforma de eventos · 2026</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
